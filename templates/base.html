<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Smart Traffic Logger</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<!-- ==========================================
     NAVBAR
=========================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <!-- Logo -->

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('index') }}">

            🚦 Smart Traffic Logger

        </a>


        <!-- Navigation -->

        <div class="d-flex gap-2">

            <!-- HOME -->

            <a
                href="{{ url_for('index') }}"
                class="nav-btn home-btn">

                🏠 Home

            </a>


            <!-- ADD VIOLATION -->

            <a
                href="{{ url_for('add_violation') }}"
                class="nav-btn add-btn">

                ➕ Add Violation

            </a>


            <!-- HISTORY -->

            <a
                href="{{ url_for('history') }}"
                class="nav-btn history-btn">

                📋 History

            </a>

        </div>

    </div>

</nav>


<!-- ==========================================
     PAGE CONTENT
=========================================== -->

<main class="container py-4">

    {% block content %}

    {% endblock %}

</main>


<!-- ==========================================
     FOOTER
=========================================== -->

<footer class="footer text-center">

    <p>
        © 2026 Smart Traffic Logger
    </p>

</footer>


</body>

</html>
